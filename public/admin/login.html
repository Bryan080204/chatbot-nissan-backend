<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Panel Nissan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/admin/css/style.css">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-brand">
      <img src="/admin/img/nissan-logo.jpg" alt="Nissan" class="login-logo">
      <h1>Panel de Administración</h1>
      <p>Chatbot WhatsApp &middot; Dashboard de actividad</p>
    </div>
    <div class="login-card">
      <div class="login-card-header">
        <h2>Iniciar sesión</h2>
        <p>Accede con tus credenciales de administrador</p>
      </div>
      <form id="formLogin" autocomplete="off">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <div class="input-wrap">
            <i class="fas fa-user"></i>
            <input type="text" id="usuario" placeholder="Escribe tu usuario" required>
          </div>
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" id="contrasena" placeholder="Escribe tu contraseña" required>
            <button type="button" id="togglePass" class="input-btn" tabindex="-1"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div id="errorLogin" class="login-error" hidden></div>
        <button type="submit" id="btnLogin" class="btn-block">
          <span class="btn-text">Entrar</span>
          <span class="spinner" hidden></span>
        </button>
      </form>
    </div>
    <p class="login-footer">&copy; 2026 Agencia Nissan &middot; Chatbot WhatsApp</p>
  </div>
  <script src="/admin/js/login.js"></script>
</body>
</html>
